<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Hình Ảnh</title>
    <style>
        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            margin-top: 20px;
        }

        h2 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 24px;
            margin-bottom: 25px;
        }

        /* Form Elements */
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 15px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        button {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* Loading State */
        #loader {
            display: none;
            margin-top: 20px;
            color: #7f8c8d;
            font-size: 15px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: #3498db;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Results Grid */
        #results {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        /* Image Card */
        .image-card {
            border: 1px solid #edf2f7;
            padding: 15px;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
        }

        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
        }

        .image-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            background-color: #f8fafc;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #edf2f7;
        }

        .image-card p {
            font-size: 14px;
            color: #4a5568;
            word-wrap: break-word;
            margin: 0 0 15px 0;
            font-weight: 600;
            flex-grow: 1;
        }

        /* Download Button */
        .btn-download {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 12px 15px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            transition: background 0.3s;
        }

        .btn-download:hover {
            background: #059669;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Tra cứu Hình ảnh</h2>
        <div class="input-group">
            <input type="text" id="phoneInput" placeholder="Nhập số điện thoại (VD: 090123...)"
                onkeypress="handleKeyPress(event)" />
        </div>
        <button onclick="searchImage()">Tìm Kiếm</button>
        <div id="loader">
            <div class="spinner"></div>Đang xử lý dữ liệu...
        </div>
        <div id="results"></div>
    </div>

    <script>
        // Link API GAS hiện tại của bạn
        const API_URL = 'https://script.google.com/macros/s/AKfycbzPItZIMaiezG5NusmWX0FcAXMxNrf8FsgUZ5Opdq3Iji3ZKx26bHzowLhKx2i2qIjA/exec';

        // Cho phép ấn Enter để tìm kiếm
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                searchImage();
            }
        }

        async function searchImage() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!phone) {
                alert("Vui lòng nhập số điện thoại!");
                return;
            }

            const loader = document.getElementById('loader');
            const resultsDiv = document.getElementById('results');

            loader.style.display = 'block';
            resultsDiv.innerHTML = '';

            try {
                const response = await fetch(`${API_URL}?phone=${encodeURIComponent(phone)}`);
                const result = await response.json();

                loader.style.display = 'none';

                if (result.status === 'success') {
                    displayResults(result.data, resultsDiv);
                } else {
                    resultsDiv.innerHTML = '<p style="color:#e53e3e; font-weight: 500;">Lỗi máy chủ: Không thể lấy dữ liệu.</p>';
                }
            } catch (error) {
                loader.style.display = 'none';
                resultsDiv.innerHTML = `<p style="color:#e53e3e; font-weight: 500;">Lỗi kết nối: ${error.message}</p>`;
            }
        }

        function displayResults(images, container) {
            if (images.length === 0) {
                container.innerHTML = '<p style="color:#e53e3e; font-weight: 500; grid-column: 1 / -1;">Không tìm thấy ảnh nào khớp với số điện thoại này.</p>';
                return;
            }

            let html = '';
            images.forEach(img => {
                // CÁCH KHẮC PHỤC LỖI ẢNH: Trích xuất ID từ viewUrl và dùng Thumbnail API của Google Drive
                let fileId = '';
                try {
                    const urlParams = new URLSearchParams(img.viewUrl.substring(img.viewUrl.indexOf('?')));
                    fileId = urlParams.get('id');
                } catch (e) { console.error(e); }

                // Sử dụng thumbnail API với kích thước lớn (w1000) để đảm bảo độ nét
                const imageSrc = fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000` : img.viewUrl;

                html += `
          <div class="image-card">
            <img src="${imageSrc}" alt="${img.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x200?text=Khong+Tai+Duoc+Anh'" />
            <p>${img.name}</p>
            <a href="${img.downloadUrl}" class="btn-download" target="_blank">Tải Xuống</a>
          </div>
        `;
            });
            container.innerHTML = html;
        }
    </script>
</body>

</html>
